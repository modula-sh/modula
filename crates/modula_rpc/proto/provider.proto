syntax = "proto3";
package modula.v1;

import "google/protobuf/struct.proto";

service ProviderService {
  rpc GetCatalog(GetProviderCatalogRequest) returns (GetProviderCatalogResponse);
  rpc List(ListProvidersRequest) returns (ListProvidersResponse);
  rpc Get(GetProviderRequest) returns (Provider);
  rpc Create(CreateProviderRequest) returns (CreateProviderResponse);
  rpc Update(UpdateProviderRequest) returns (UpdateProviderResponse);
  rpc Delete(DeleteProviderRequest) returns (DeleteProviderResponse);
}

message CatalogModel {
  string id = 1;
  string label = 2;
}

message CatalogProvider {
  string id = 1;
  repeated CatalogModel models = 2;
}

message McpServer {
  string key = 1;
  string url = 2;
  optional string auth_token = 3;
}

message Provider {
  string id = 1;
  string name = 2;
  string type = 3;
  optional string description = 4;
  string config_dir = 5;
  bool config_dir_exists = 6;
  uint64 mcp_server_count = 7;
  repeated string mcp_endpoints = 8;
  repeated string agents_using = 9;
  // Managed (url-based) MCP servers; populated on Get, empty on List.
  repeated McpServer mcp_servers = 10;
  // Schemaless MCP summary (config_exists / projects / needs_auth); populated on
  // Get only. Unset on List.
  optional google.protobuf.Struct mcp_summary = 11;
}

message GetProviderCatalogRequest {}
message GetProviderCatalogResponse {
  repeated CatalogProvider providers = 1;
}

message ListProvidersRequest {
  string workspace_id = 1;
}
message ListProvidersResponse {
  repeated Provider providers = 1;
}

message GetProviderRequest {
  string workspace_id = 1;
  string provider_id = 2;
}

message CreateProviderRequest {
  string workspace_id = 1;
  string name = 2;
  // Provider type (e.g. "claude", "codex"). Defaults to "claude" when empty.
  string type = 3;
  string config_dir = 4;
  optional string description = 5;
  repeated McpServer mcp_servers = 6;
}
message CreateProviderResponse {
  string id = 1;
  string name = 2;
}

message UpdateProviderRequest {
  string workspace_id = 1;
  string provider_id = 2;
  optional string name = 3;
  optional string type = 4;
  optional string config_dir = 5;
  // Use google.protobuf.StringValue pattern: pass reset_description=true to clear.
  // Not `clear_description`: swift-protobuf renames `description` around
  // `CustomStringConvertible` and the two fields then generate the same accessor.
  optional string description = 6;
  bool reset_description = 7;
  // When set, reconciles MCP servers in the config file.
  repeated McpServer mcp_servers = 8;
  bool update_mcp_servers = 9;
}
message UpdateProviderResponse {
  string id = 1;
}

message DeleteProviderRequest {
  string workspace_id = 1;
  string provider_id = 2;
}
message DeleteProviderResponse {
  string id = 1;
}
