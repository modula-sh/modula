syntax = "proto3";
package modula.v1;

service UsageService {
  rpc Get(GetUsageRequest) returns (GetUsageResponse);
}

message UsageTokens {
  int64 input = 1;
  int64 output = 2;
  int64 cache_creation = 3;
  int64 cache_read = 4;
}

// One finished agent run, extracted from the `result` event at the end of the
// run's log. Runs without that event (in-flight, crashed, non-claude) are omitted.
message UsageEntry {
  int64 run_id = 1;
  string log = 2;
  string agent = 3;
  string mtime = 4;
  int64 duration_ms = 5;
  double cost_usd = 6;
  UsageTokens tokens = 7;
}

message GetUsageRequest {
  string workspace_id = 1;
}
message GetUsageResponse {
  repeated UsageEntry entries = 1;
}
