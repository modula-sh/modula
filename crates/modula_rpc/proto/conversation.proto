syntax = "proto3";
package modula.v1;

import "google/protobuf/struct.proto";

service ConversationService {
  rpc List(ListConversationsRequest) returns (ListConversationsResponse);
  rpc Get(GetConversationRequest) returns (Conversation);
  // A page of messages older than `before_seq`, oldest first.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc Create(CreateConversationRequest) returns (CreateConversationResponse);
  // Clone a conversation up to one of its messages; returns the clone's id.
  rpc Fork(ForkConversationRequest) returns (CreateConversationResponse);
  rpc Update(UpdateConversationRequest) returns (UpdateConversationResponse);
  rpc Delete(DeleteConversationRequest) returns (DeleteConversationResponse);
  // Start or continue a run; returns a server stream of ConvEvent.
  // Dropping the stream detaches without cancelling the underlying run.
  rpc Send(SendMessageRequest) returns (stream ConvEvent);
  // Attach to an in-flight run; replays buffered events then streams live ones.
  // Dropping the stream detaches; the run continues.
  rpc Attach(AttachConversationRequest) returns (stream ConvEvent);
  rpc Cancel(CancelConversationRequest) returns (CancelConversationResponse);
  // Queue a message for the in-flight run; sends immediately if idle. Runs that
  // accept stdin input take it mid-turn at a tool boundary.
  rpc Enqueue(EnqueueMessageRequest) returns (QueuedMessagesResponse);
  rpc Dequeue(DequeueMessageRequest) returns (QueuedMessagesResponse);
  // How to spawn a terminal conversation's TUI; the caller hosts the PTY. The
  // first launch starts a session with `prompt`, later ones resume it.
  rpc TerminalLaunch(TerminalLaunchRequest) returns (LaunchSpec);
  // Attach to a terminal conversation's TUI, launching it at `cols`×`rows` when
  // it isn't running. Replays its buffered output, then streams live output and
  // ends with its exit code. Dropping the stream detaches; the TUI keeps running.
  rpc TerminalOpen(TerminalOpenRequest) returns (stream TerminalOutput);
  rpc TerminalWrite(TerminalWriteRequest) returns (TerminalAck);
  // Every client shares the one PTY, so the last resize wins.
  rpc TerminalResize(TerminalResizeRequest) returns (TerminalAck);
}

message QueuedMessage {
  string id = 1;
  string content = 2;
}

message ChatMessage {
  string role = 1;
  // The message as plain text: all of a user message, the text parts of an
  // assistant one.
  string content = 2;
  string ts = 3;
  // Position in the conversation, from 0.
  uint32 seq = 4;
  // An assistant message's text, thinking and tool calls, in the order they
  // happened.
  repeated MessagePart parts = 5;
  optional TurnStats stats = 6;
}

message MessagePart {
  oneof part {
    string text = 1;
    string thinking = 2;
    ToolCall tool = 3;
  }
}

enum ToolStatus {
  TOOL_STATUS_RUNNING = 0;
  TOOL_STATUS_COMPLETED = 1;
  TOOL_STATUS_FAILED = 2;
}

message ToolCall {
  string id = 1;
  // The provider's own tool name and input, unmodified.
  string name = 2;
  google.protobuf.Value input = 3;
  // The tool call this one ran under: a sub-agent's calls point at the call
  // that spawned it.
  optional string parent_id = 4;
  ToolStatus status = 5;
  // What the tool returned, as text.
  optional string output = 6;
  // `output` was cut to the stored cap.
  bool output_truncated = 7;
}

// What the provider reported for the turn that produced a message.
message TurnStats {
  optional uint64 duration_ms = 1;
  // Prompt tokens, cached ones included.
  optional uint64 input_tokens = 2;
  optional uint64 output_tokens = 3;
  optional double cost_usd = 4;
  optional string model = 5;
}

message ConversationSummary {
  string id = 1;
  string title = 2;
  string provider_id = 3;
  optional string model = 4;
  // Schemaless context (workspace_id, task_id, variant_id, etc.).
  google.protobuf.Struct context = 5;
  string updated_at = 6;
  repeated QueuedMessage queued = 8;
  // A provider run is in flight for this conversation right now. Runtime state
  // read from the run registry, not a stored column.
  bool running = 7;
  // `chat` or `terminal`, fixed at create.
  string mode = 9;
}

message Conversation {
  string id = 1;
  string title = 2;
  string provider_id = 3;
  optional string model = 4;
  google.protobuf.Struct context = 5;
  optional string session_id = 6;
  // The tail when the request set `message_limit`, else every message.
  repeated ChatMessage messages = 7;
  string created_at = 8;
  string updated_at = 9;
  repeated QueuedMessage queued = 10;
  // Runtime state read from the run registry, not a stored column.
  bool running = 11;
  // How many messages the conversation holds in all.
  uint32 message_count = 12;
  // `chat` or `terminal`, fixed at create.
  string mode = 13;
}

// Server-streaming event. oneof mirrors the existing WireEvent variants.
message ConvEvent {
  oneof event {
    SessionEvent session = 1;
    ToolUseEvent tool_use = 2;
    DeltaEvent delta = 3;
    DoneEvent done = 4;
    ErrorEvent error = 5;
    UserEvent user = 6;
    ToolResultEvent tool_result = 7;
    ThinkingEvent thinking = 8;
  }
}

// A queued message taken into the run mid-turn; the reply before it is
// persisted, so clients refetch and restart their in-flight text.
message UserEvent {
  string text = 1;
}

message SessionEvent {
  string id = 1;
}

message ToolUseEvent {
  string name = 1;
  // Tool input is schemaless provider-specific JSON.
  google.protobuf.Struct input = 2;
  // Matches the `tool_result` that completes this call.
  string id = 3;
  optional string parent_id = 4;
}

message ToolResultEvent {
  string id = 1;
  string output = 2;
  bool is_error = 3;
  bool output_truncated = 4;
}

message ThinkingEvent {
  string text = 1;
}

message DeltaEvent {
  string text = 1;
}

message DoneEvent {}

message ErrorEvent {
  string message = 1;
}

message ListConversationsRequest {
  string workspace_id = 1;
}
message ListConversationsResponse {
  repeated ConversationSummary conversations = 1;
}

message GetConversationRequest {
  string workspace_id = 1;
  string conversation_id = 2;
  // Return only the newest `message_limit` messages; absent returns all.
  optional uint32 message_limit = 3;
}

message ListMessagesRequest {
  string workspace_id = 1;
  string conversation_id = 2;
  uint32 before_seq = 3;
  uint32 limit = 4;
}
message ListMessagesResponse {
  repeated ChatMessage messages = 1;
}

message CreateConversationRequest {
  string workspace_id = 1;
  string provider_id = 2;
  optional string title = 3;
  optional string model = 4;
  google.protobuf.Struct context = 5;
  // `chat` (default) or `terminal`. A provider that can't run in a terminal
  // gets `chat`.
  optional string mode = 6;
}
message CreateConversationResponse {
  string id = 1;
}

message ForkConversationRequest {
  string workspace_id = 1;
  string conversation_id = 2;
  // The last message the clone keeps; absent keeps none.
  optional uint32 through_seq = 3;
}

message UpdateConversationRequest {
  string workspace_id = 1;
  string conversation_id = 2;
  optional string title = 3;
}
message UpdateConversationResponse {
  bool ok = 1;
}

message DeleteConversationRequest {
  string workspace_id = 1;
  string conversation_id = 2;
}
message DeleteConversationResponse {
  bool ok = 1;
}

message SendMessageRequest {
  string workspace_id = 1;
  string conversation_id = 2;
  string message = 3;
  // Optional per-turn model override (absent = keep current model).
  optional string model = 4;
}

message AttachConversationRequest {
  string workspace_id = 1;
  string conversation_id = 2;
}

message CancelConversationRequest {
  string workspace_id = 1;
  string conversation_id = 2;
}
message CancelConversationResponse {
  bool ok = 1;
}

message EnqueueMessageRequest {
  string workspace_id = 1;
  string conversation_id = 2;
  string message = 3;
}

message DequeueMessageRequest {
  string workspace_id = 1;
  string conversation_id = 2;
  string queued_id = 3;
}

message QueuedMessagesResponse {
  repeated QueuedMessage queued = 1;
}

message TerminalLaunchRequest {
  string workspace_id = 1;
  string conversation_id = 2;
  // The first message; ignored once the session exists.
  optional string prompt = 3;
}

message LaunchSpec {
  // `argv[0]` is the resolved executable.
  repeated string argv = 1;
  map<string, string> env = 2;
  string cwd = 3;
}

message TerminalOpenRequest {
  string workspace_id = 1;
  string conversation_id = 2;
  // The first message; ignored once the session exists.
  optional string prompt = 3;
  uint32 cols = 4;
  uint32 rows = 5;
}

message TerminalOutput {
  oneof event {
    bytes data = 1;
    uint32 exit_code = 2;
  }
}

message TerminalWriteRequest {
  string workspace_id = 1;
  string conversation_id = 2;
  bytes data = 3;
}

message TerminalResizeRequest {
  string workspace_id = 1;
  string conversation_id = 2;
  uint32 cols = 3;
  uint32 rows = 4;
}

message TerminalAck {}
