<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        var saved = null;
        try { saved = localStorage.getItem('modula.theme'); } catch (_) {}
        // Glass variants share a mode: "dark-glass" paints with the dark tokens.
        var mode;
        if (saved === "light" || saved === "light-glass") {
          mode = "light";
        } else if (saved === "dark" || saved === "dark-glass") {
          mode = "dark";
        } else {
          var prefersDark = false;
          try { prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (_) {}
          mode = prefersDark ? "dark" : "light";
        }
        document.documentElement.dataset.theme = mode;
      })();
    </script>
    <title>MODULA</title>
  </head>
  <body class="font-mono text-sm antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
