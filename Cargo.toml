[workspace]
resolver = "2"
members = [
    "apps/engine",
    "apps/desktop/src-tauri",
    "crates/modula_platform",
    "crates/modula_rpc",
    "crates/modula_types",
    "crates/modula_client",
    "crates/modula_db",
    "crates/modula_engine_transport",
    "crates/modula_integrations",
    "crates/modula_mock_claude",
    "crates/modula_test_support",
    "tests/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Elastic-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_with = "3"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
tempfile = "3"
nix = { version = "0.29", features = ["signal", "process", "fs", "user"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"
hyper-util = { version = "0.1", features = ["tokio"] }
modula-platform = { path = "crates/modula_platform" }
modula-rpc = { path = "crates/modula_rpc" }
modula-types = { path = "crates/modula_types" }
modula-client = { path = "crates/modula_client" }
modula-db = { path = "crates/modula_db" }
modula-engine-transport = { path = "crates/modula_engine_transport" }
modula-integrations = { path = "crates/modula_integrations" }
reqwest = { version = "0.13", features = ["json", "query"] }
tokio-cron-scheduler = "0.13"
cron = "0.12"
chrono-tz = "0.10"
include_dir = "0.7"
futures = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
parking_lot = "0.12"
walkdir = "2"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros", "migrate", "chrono"] }
toml = "0.8"
toml_edit = "0.25"
jsonc-parser = { version = "0.32", features = ["serde"] }
dirs = "6"
